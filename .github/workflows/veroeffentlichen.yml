name: MobiMory veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Neueste ZIP-Datei auspacken
        run: |
          ZIP=$(ls MobiMory-V2_*.zip | sort -V | tail -n 1)
          echo "Verwendet wird: $ZIP"
          mkdir app
          unzip -q "$ZIP" -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prüfen
        run: cd app && npm test
      - name: App zusammenstellen
        run: |
          mkdir _site
          cd app
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js icons lib ../_site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
