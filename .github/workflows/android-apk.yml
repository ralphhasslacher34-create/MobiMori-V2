name: Android-APK bauen

# Diese Datei liegt im Repository unter .github/workflows/android-apk.yml (im Hauptverzeichnis, nicht in der ZIP) und baut die App aus der neuesten ZIP.
# Start: bei jedem Hochladen in den Hauptzweig, oder von Hand über „Run workflow“.
#
# Ohne Release-Schlüssel (Geheimnisse MM_KEYSTORE_BASE64 und MM_KEYSTORE_PASSWORD fehlen):
#   Test-APK wie bisher. Download: Artifacts › MobiMory-APK.
# Mit Release-Schlüssel (seit 2.0.113):
#   Echte, signierte APK. Download: Artifacts › MobiMory-Download. Darin liegen MobiMory.apk, version.json und download.html
#   für die Homepage mobimory.com.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      MIT_SCHLUESSEL: ${{ secrets.MM_KEYSTORE_BASE64 != '' && secrets.MM_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Neueste ZIP-Datei auspacken
        run: |
          ZIP=$(ls MobiMory-V2_*.zip | sort -V | tail -n 1)
          echo "Verwendet wird: $ZIP"
          mkdir app
          unzip -q "$ZIP" -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Werkzeuge installieren
        working-directory: app
        run: npm ci
      - name: Tests
        working-directory: app
        run: npm test
      - name: Dateien für die Hülle
        working-directory: app
        run: |
          rm -rf www
          mkdir www
          cp -r index.html manifest.webmanifest sw.js css js icons lib handbuch www/
      - name: Hülle abgleichen
        working-directory: app
        run: npx cap sync android

      # --- Mit Release-Schlüssel: echte APK ---
      - name: Release-Schlüssel bereitstellen
        if: env.MIT_SCHLUESSEL == 'true'
        env:
          MM_KEYSTORE_BASE64: ${{ secrets.MM_KEYSTORE_BASE64 }}
        run: |
          echo "$MM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mobimory-release.jks"
          echo "MM_KEYSTORE_FILE=$RUNNER_TEMP/mobimory-release.jks" >> "$GITHUB_ENV"
      - name: Echte APK bauen (signiert)
        if: env.MIT_SCHLUESSEL == 'true'
        working-directory: app/android
        env:
          MM_KEYSTORE_PASSWORD: ${{ secrets.MM_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Download-Ordner für mobimory.com zusammenstellen
        if: env.MIT_SCHLUESSEL == 'true'
        run: |
          APK=app/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "Die signierte APK fehlt (app-release.apk)."; ls -R app/android/app/build/outputs/apk || true; exit 1; }
          mkdir download
          cp "$APK" download/MobiMory.apk
          cp app/docs/download.html download/download.html
          node -e "const v=require('./app/package.json').version; require('fs').writeFileSync('download/version.json', JSON.stringify({version:v, versionCode:Number(process.env.GITHUB_RUN_NUMBER), apk:'https://mobimory.com/MobiMory.apk'}, null, 2)+'\n')"
          cat download/version.json
          GROESSE=$(stat -c %s download/MobiMory.apk)
          echo "Größe der APK: $GROESSE Bytes"
          if [ "$GROESSE" -gt 26214400 ]; then echo "::warning::Die APK ist größer als 25 MiB. Cloudflare nimmt für die Homepage nur Dateien bis 25 MiB."; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          "${BT}apksigner" verify --print-certs download/MobiMory.apk || echo "Hinweis: Die Signatur konnte hier nicht angezeigt werden."
      - uses: actions/upload-artifact@v4
        if: env.MIT_SCHLUESSEL == 'true'
        with:
          name: MobiMory-Download
          path: download/
          if-no-files-found: error

      # --- Ohne Release-Schlüssel: Test-APK wie bisher ---
      - name: Debug-APK bauen
        if: env.MIT_SCHLUESSEL != 'true'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.MIT_SCHLUESSEL != 'true'
        with:
          name: MobiMory-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
